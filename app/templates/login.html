{% extends "base.html" %}
{% block title %}Login — StudyBuddy{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to your StudyBuddy account</p>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <div class="form-group">
        <label for="identifier">Email or Username</label>
        <input
          type="text"
          id="identifier"
          name="identifier"
          class="form-control"
          placeholder="you@example.com"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-eye-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
          <button type="button" class="eye-btn" onclick="togglePassword('password', this)">👁</button>
        </div>
      </div>

      <div class="form-check">
        <input type="checkbox" id="remember" name="remember" />
        <label for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a>
    </p>
  </div>
</div>

<script>
function togglePassword(fieldId, btn) {
  const field = document.getElementById(fieldId);
  if (field.type === 'password') { field.type = 'text'; btn.textContent = '🙈'; }
  else { field.type = 'password'; btn.textContent = '👁'; }
}
</script>
{% endblock %}
